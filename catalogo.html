<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo | Fotografía Vitale</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff6b6b;
            --dark: #2d3436;
            --light: #f5f6fa;
            --whatsapp: #25d366;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: var(--light);
            color: var(--dark);
            padding-bottom: 60px;
        }
        /* BARRA SUPERIOR / HEADER */
        .catalogo-header {
            background-color: white;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 90;
        }
        .catalogo-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 15px auto;
        }
        .btn-volver {
            color: var(--dark);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        .btn-volver:hover { color: var(--primary); }
        .catalogo-header h1 {
            font-size: 1.8rem;
            color: var(--dark);
        }

        /* CONTROLES: BUSCADOR Y FILTROS */
        .filtros-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .search-box {
            position: relative;
            width: 100%;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 30px;
            border: 1px solid #dfe6e9;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(255, 107, 107, 0.2);
        }
        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #b2bec3;
        }
        .categorias-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn-filtro {
            background-color: #f1f2f6;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--dark);
            transition: 0.2s;
        }
        .btn-filtro.activo, .btn-filtro:hover {
            background-color: var(--primary);
            color: white;
        }

        /* GRILLA DE ARTÍCULOS */
        .catalogo-grid {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }
        .producto-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            border: 1px solid #f1f2f6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .producto-card:hover { transform: translateY(-4px); }
        .producto-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            background-color: #fff;
            margin-bottom: 12px;
        }
        .producto-card h3 {
            font-size: 1rem;
            margin-bottom: 5px;
            color: var(--dark);
        }
        .producto-card .categoria-tag {
            font-size: 0.75rem;
            color: #b2bec3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .producto-card .precio {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }
        .btn-consultar {
            background: var(--dark);
            color: white;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            transition: 0.2s;
        }
        .btn-consultar:hover { background-color: var(--primary); }

        /* MENSAJE CUANDO NO HAY RESULTADOS */
        .sin-resultados {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #636e72;
        }

        /* BOTÓN FLOTANTE WHATSAPP */
        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 30px;
            right: 30px;
            background-color: var(--whatsapp);
            color: #FFF;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            z-index: 100;
            text-decoration: none;
            transition: 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.1); }

        /* ========================================== */
/* AJUSTES PARA CELULARES (PANTALLAS CHICAS)  */
/* ========================================== */
@media (max-width: 768px) {
    /* Reduce los espacios en blanco gigantes de las secciones */
    .intro-section,
    .nosotros-section {
        padding: 30px 15px !important;
    }

    /* Reduce el tamaño de los títulos principales */
    .section-title,
    .nosotros-section h2 {
        font-size: 1.5rem !important;
        margin-bottom: 8px !important;
    }

    .intro-section p,
    .nosotros-section p {
        font-size: 0.95rem !important;
        line-height: 1.5 !important;
        margin-bottom: 15px !important;
    }

    .btn-main {
        padding: 12px 25px !important;
        font-size: 0.95rem !important;
    }

    /* Grilla de categorías principal más compacta */
    .grid {
        gap: 15px !important;
    }

    .card {
        padding: 20px 15px !important;
    }

    .card .icon {
        font-size: 2.2rem !important;
    }

    .card h3 {
        font-size: 1.2rem !important;
    }

    /* GRILLAS DE PRODUCTOS: 2 POR FILA EN CELULAR */
    .productos-grid,
    .catalogo-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 12px !important;
        padding: 0 !important;
    }

    .producto-item,
    .producto-card {
        padding: 10px !important;
    }

    /* Achica la altura de las fotos para no ocupar toda la pantalla */
    .producto-item img,
    .producto-card img {
        height: 120px !important;
        margin-bottom: 8px !important;
    }

    .producto-item h4,
    .producto-card h3 {
        font-size: 0.9rem !important;
        margin-bottom: 4px !important;
    }

    .producto-item .precio,
    .producto-card .precio {
        font-size: 1rem !important;
        margin-bottom: 8px !important;
    }

    .btn-comprar,
    .btn-consultar {
        padding: 6px 10px !important;
        font-size: 0.8rem !important;
        width: 100% !important;
        display: block !important;
    }

    /* Botón flotante de WhatsApp más proporcionado */
    .whatsapp-float {
        width: 50px !important;
        height: 50px !important;
        bottom: 20px !important;
        right: 20px !important;
    }

    .whatsapp-float svg {
        width: 28px !important;
        height: 28px !important;
    }
}
    </style>
</head>
<body>

    <header class="catalogo-header">
        <div class="catalogo-nav">
            <a href="index.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
            <h1>Catálogo General</h1>
            <div style="width: 100px;"></div>
        </div>

        <div class="filtros-container">
            <!-- Barra de Búsqueda -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="buscador" placeholder="Buscar por nombre, modelo o tipo...">
            </div>

            <!-- Botones de Categorías -->
            <div class="categorias-bar">
                <button class="btn-filtro activo" onclick="filtrarCategoria('todos', this)">Todos</button>
                <button class="btn-filtro" onclick="filtrarCategoria('fotografia', this)">Fotografía</button>
                <button class="btn-filtro" onclick="filtrarCategoria('tecnologia', this)">Tecnología & Gaming</button>
                <button class="btn-filtro" onclick="filtrarCategoria('outdoor', this)">Outdoor & Caza</button>
            </div>
        </div>
    </header>

    <!-- Contenedor dinámico donde se imprimen los productos -->
    <main class="catalogo-grid" id="grilla-productos"></main>

    <!-- WhatsApp Flotante -->
    <a href="https://wa.me/+5492634779824?text=Hola!%20Quería%20hacer%20una%20consulta%20del%20catálogo." class="whatsapp-float" target="_blank">
        <svg viewBox="0 0 32 32" width="35" height="35" fill="white"><path d="M16 2.67C8.64 2.67 2.67 8.64 2.67 16c0 2.34.61 4.54 1.68 6.47L2.67 29.33l7.03-1.68c1.88 1.02 4.02 1.68 6.3 1.68 7.36 0 13.33-5.97 13.33-13.33S23.36 2.67 16 2.67zm7.66 19.26c-.32.88-1.58 1.64-2.22 1.74-.58.08-1.34.25-4.22-.95-3.48-1.45-5.75-5-5.93-5.24-.18-.24-1.41-1.89-1.41-3.6 0-1.72.9-2.56 1.22-2.92.32-.36.7-.45.93-.45h.68c.24 0 .56-.09.84.58.3.72 1 2.45 1.09 2.63.09.18.15.39.03.63-.12.24-.18.39-.36.6-.18.21-.38.45-.53.59-.18.18-.38.37-.17.73.21.36.93 1.54 2 2.5 1.38 1.24 2.54 1.62 2.9 1.8.36.18.57.15.78-.09.21-.24.9-1.05 1.14-1.41.24-.36.48-.3.81-.18.33.12 2.1.99 2.46 1.17.36.18.6.27.69.42.09.15.09.87-.23 1.75z"/></svg>
    </a>

    <script>
        
        // 1. VARIABLE CON LA RUTA DE LA CARPETA
        const RUTA_FOTOS = "productos/";

        // LISTA CENTRALIZADA DE PRODUCTOS (Para sumar más, solo agregás un bloque aquí)
        const productos = [
            {
                nombre: "Revelado Fotográfico Tamaño 10x15",
                categoria: "fotografia",
                precio: "Consultar",
                imagen: "Fotos.jpeg"
            },
            {
                nombre: "Revelado Fotográfico Tamaño 13x18",
                categoria: "fotografia",
                precio: "Consultar",
                imagen: "Fotos.jpeg"
            },
            {
                nombre: "Revelado Fotográfico Tamaño 15x21",
                categoria: "fotografia",
                precio: "Consultar",
                imagen: "Fotos.jpeg"
            },  
            {
                nombre: "Revelado Fotográfico Tamaño 20x30",
                categoria: "fotografia",
                precio: "Consultar",
                imagen: "Fotos.jpeg"
            },

            {
                nombre: "Cuadros (Consultar variedad de tamaños y modelos)",
                categoria: "fotografia",
                precio: "Consultar",
                imagen: "cuadros.jpeg"
            },
            {
                nombre: "Joystick Inalámbrico PS4",
                categoria: "tecnologia",
                precio: "$XX.XXX",
                imagen: "jostik.jpeg"
            },
            {
                nombre: "Auriculares Vincha Bluetooth",
                categoria: "tecnologia",
                precio: "$XX.XXX",
                imagen: "auricularvincha.jpeg"
            },
            {
                nombre: "Cargador Carga Rápida USB-C",
                categoria: "tecnologia",
                precio: "$XX.XXX",
                imagen: "cargador.jpeg"
            },
            {
                nombre: "Rifle Fox PCP M25 6,35mm",
                categoria: "outdoor",
                precio: "$770.000",
                imagen: "m25.jpeg"
            },
             {
                nombre: "Rifle Fox PCP PR900 Madera 5,5mm",
                categoria: "outdoor",
                precio: "$645.000",
                imagen: "pr900.jpeg"
            },
            {
                nombre: "Cuchillo Táctico de Supervivencia",
                categoria: "outdoor",
                precio: "$XX.XXX",
                imagen: "cuchi.jpeg"
            },
            {
                nombre: "Rifle Fox Nitro Piston GR1600 6,35mm",
                categoria: "outdoor",
                precio: "$360.000",
                imagen: "gr1600.jpeg"
            },
            {
                nombre: "Rifle Fox Nitro Piston Combat con Cargador 5,5mm",
                categoria: "outdoor",
                precio: "$220.000",
                imagen: "combat.jpeg"
            },
             {
                nombre: "Rifle Fox Nitro Piston Bravo 5,5mm",
                categoria: "outdoor",
                precio: "$210.000",
                imagen: "bravo.jpeg"
            },
                
        ];

        const NUMERO_WSP = "+5492634779824"; // Reemplazá con tu número real
        let categoriaActiva = 'todos';

        const grilla = document.getElementById('grilla-productos');
        const inputBuscador = document.getElementById('buscador');

        // Función para renderizar los productos en pantalla
        function renderizar(lista) {
            grilla.innerHTML = "";
            if (lista.length === 0) {
                grilla.innerHTML = `<div class="sin-resultados">
                    <i class="fa-solid fa-box-open" style="font-size: 2.5rem; margin-bottom: 10px;"></i>
                    <p>No encontramos ningún producto que coincida con tu búsqueda.</p>
                </div>`;
                return;
            }

            lista.forEach(prod => {
                const mensajeWsp = encodeURIComponent(`Hola! Quería consultar por disponibilidad y precio de: ${prod.nombre}`);
                const card = document.createElement('div');
                card.className = "producto-card";
                card.innerHTML = `
                    <div>
                        <img src="${RUTA_FOTOS + prod.imagen}" alt="${prod.nombre}">
                        <div class="categoria-tag">${prod.categoria}</div>
                        <h3>${prod.nombre}</h3>
                    </div>
                    <div>
                        <div class="precio">${prod.precio}</div>
                        <a href="https://wa.me/${NUMERO_WSP}?text=${mensajeWsp}" target="_blank" class="btn-consultar">Consultar</a>
                    </div>
                `;
                grilla.appendChild(card);
            });
        }

        // Lógica de filtrado combinado (Texto + Categoría)
        function aplicarFiltros() {
            const texto = inputBuscador.value.toLowerCase().trim();
            const filtrados = productos.filter(prod => {
                const coincideCategoria = (categoriaActiva === 'todos' || prod.categoria === categoriaActiva);
                const coincideTexto = prod.nombre.toLowerCase().includes(texto);
                return coincideCategoria && coincideTexto;
            });
            renderizar(filtrados);
        }

        function filtrarCategoria(cat, boton) {
            categoriaActiva = cat;
            document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo'));
            boton.classList.add('activo');
            aplicarFiltros();
        }

        // Evento de escritura en el buscador
        inputBuscador.addEventListener('input', aplicarFiltros);

        // Carga inicial
        renderizar(productos);
    </script>
</body>
</html>
